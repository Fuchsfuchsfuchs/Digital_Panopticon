name: Deploy to Neocities

on:
  push:
    branches:
      - main # Passe dies an, falls dein Hauptbranch 'master' heißt

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Lädt deine Dateien in den Runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Lädt das gesamte Repository direkt zu Neocities hoch (ohne npm!)
      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v1
        with:
          api_token: ${{ secrets.NEOCITIES_API_TOKEN }}
          cleanup: false
          dist_dir: '.'
